<style>
:root{--bg:#f4f1ea;--card:#ffffff;--ink:#14143c;--muted:#6b6b80;--line:#e4dfd4;--navy:#14143c;--red:#d3232f;
--ok:#1f7a4d;--okbg:#e6f4ec;--run:#3f3dbf;--runbg:#ecebfb;--pend:#a86a00;--pendbg:#fff3d9;--blk:#b4232f;--blkbg:#fde7e8;--warn:#a86a00;--warnbg:#fff3d9;--accent:#d3232f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121220;--card:#1c1c2e;--ink:#ecebf5;--muted:#a3a2b8;--line:#2e2e45;--navy:#c9c8ff;
--okbg:#163327;--ok:#6fd3a0;--runbg:#24234a;--run:#a9a7ff;--pendbg:#3a2e12;--pend:#f0c062;--blkbg:#3d1a1d;--blk:#ff8a92;--warnbg:#3a2e12;--warn:#f0c062}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Inter',system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 40px}
.mono,.lbl{font-family:'JetBrains Mono',ui-monospace,monospace}
header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}.brand img{height:40px;background:#fff;padding:6px 10px;border-radius:6px}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.lbl b{color:var(--accent)}
h1{font-size:34px;margin:0 0 6px;letter-spacing:-.02em}h1 em{color:var(--red);font-style:italic}
.sub{max-width:520px;color:var(--muted);margin:0}.sub2{font-size:12px;color:var(--pend);margin-top:6px}
.meta{text-align:right;align-self:flex-end}.meta .d{font-size:20px;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0 22px}
nav button{background:none;border:0;padding:10px 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav button span{font-family:'JetBrains Mono',monospace;font-size:10px;margin-right:4px}
nav button.on{color:var(--ink);border-color:var(--navy);font-weight:600}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:17px}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.note{color:var(--muted);font-size:12.5px;margin:6px 0 10px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin:2px 4px 2px 0;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.run{background:var(--runbg);color:var(--run)}.chip.pend{background:var(--pendbg);color:var(--pend)}.chip.blk{background:var(--blkbg);color:var(--blk)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.mut{background:var(--line);color:var(--muted)}
.bar{height:7px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 8px}.bar i{display:block;height:100%;background:var(--navy);border-radius:6px}.bar.red i{background:var(--red)}.bar.thin{height:5px;margin:6px 0 0}
.init .row{display:flex;justify-content:space-between;align-items:center;gap:10px}.init h3{margin:0;font-size:15px}.init small{color:var(--muted);display:block}
.pctpill{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--runbg);color:var(--run);padding:3px 10px;border-radius:20px;font-weight:600}
.hero{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center}.big{font-size:56px;font-weight:800;color:var(--red);line-height:1}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.kpi{border:1px solid var(--line);border-radius:8px;padding:12px}.kpi b{font-size:24px;display:block}.kpi small{color:var(--muted);font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 6px}
.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}.num{text-align:right;font-variant-numeric:tabular-nums}
.mini{display:inline-block;width:70px;height:6px;background:var(--line);border-radius:4px;margin-right:6px;vertical-align:middle}.mini i{display:block;height:100%;background:var(--navy);border-radius:4px}
.ic{display:inline-block;width:16px;font-size:11px}.ic.ok{color:var(--ok)}.ic.run{color:var(--run)}.ic.pend{color:var(--pend)}
details.sprint{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 16px;margin-bottom:10px}
details.sprint summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 0}details.sprint summary::-webkit-details-marker{display:none}
.spcode{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--red);min-width:42px}.sptitle{flex:1;font-weight:600}.sptitle small{display:block;font-weight:400;color:var(--muted);font-size:12px}.sptitle a{font-size:11px;font-weight:400;color:var(--run);margin-left:6px}
.caret{color:var(--muted)}details.sprow{border-top:1px solid var(--line);margin-top:6px}details.sprow summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 0}details.sprow summary::-webkit-details-marker{display:none}details.sprow[open] .caret{transform:rotate(180deg)}details.sprow table{margin-bottom:12px}details[open] .caret{transform:rotate(180deg)}details.sprint table{margin-bottom:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
ol.scope{list-style:none;padding:0;margin:10px 0 0}ol.scope li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}ol.scope .n{font-family:'JetBrains Mono',monospace;color:var(--red);font-weight:700;min-width:18px}ol.scope small{display:block}
.hcard,.mcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;background:var(--card)}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.hinfo{flex:1}.hinfo small,.mcard small{display:block;color:var(--muted);font-size:12px}.hval{text-align:right;font-weight:700;font-size:18px}.hval small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.total{font-size:30px;font-weight:800;color:var(--red)}
.milestone{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:13px;color:var(--ink)}.grp{font-weight:600;color:var(--ink);margin-top:14px}.method{border-left:3px solid var(--run);background:var(--runbg);padding:12px 14px;border-radius:6px;font-size:12.5px}
footer{text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
.ghost{opacity:.7;border-style:dashed}

.tab .tbl td{overflow-wrap:anywhere}nav button b{font-weight:inherit}nav button b.sm,.rscards{display:none}
.rscard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}.rsh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}.rsm{color:var(--muted);font-size:12px;margin:4px 0}.rsb{display:flex;align-items:center;gap:8px}.rsb .bar{flex:1;margin:0}
@media(max-width:720px){
html,body{overflow-x:clip}.wrap{padding:18px 16px 32px}
.brand{flex-wrap:wrap;gap:8px}.brand img{height:34px}.big{font-size:44px}.card{padding:16px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);margin:14px -16px 18px;padding:0 16px}nav button{padding:10px 6px;font-size:12.5px}nav button span{display:none}details.sprint .spcode{min-width:auto}nav{justify-content:space-between}nav button b.lg{display:none}nav button b.sm{display:inline}
.rstbl{display:none}.rscards{display:block}
details.sprow summary{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
details.sprow .spcode{grid-column:1;grid-row:1}details.sprow summary .chip{grid-column:2;grid-row:1;justify-self:start}details.sprow .caret{grid-column:3;grid-row:1}
details.sprow .sptitle{grid-column:1/-1;grid-row:2}details.sprow .dup{display:none}
details.sprint summary{gap:8px}
.tbl.tasks thead{display:none}.tbl.tasks tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}.tbl.tasks td{display:block;border:0;padding:2px 0}
.tbl.bl td:nth-child(2),.tbl.bl td:nth-child(3){display:inline-block;margin-right:6px}.tbl.bl td.mono{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.head{flex-direction:column;align-items:flex-start;gap:4px}
}
@media(max-width:720px){.hero,.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.meta{text-align:left}h1{font-size:28px}}

.preview{border:2px dashed var(--pend);background:var(--pendbg)}.preview ul{margin:8px 0 0;padding-left:18px;font-size:13px}

      const per = period(l);
      const ft = field.filter(t => t.l === l.id);
      const sd = ft.filter(t => isDone(t.s)).length, sn = ft.length, pc = capped(sd, sn);
      const lst = low(l.st);
      let state;
      const ov = CFG.SPRINT_OVERRIDE[l.id];
      const listClosed = ov ? ov === "cerrado" : CFG.LIST_CLOSED.test(lst);
      const listPlanned = ov ? ov === "iniciar" : CFG.LIST_PLANNED.test(lst);
      const listActive = ov ? ov === "curso" : CFG.LIST_ACTIVE.test(lst);
      if (lst && !ov && !listClosed && !listPlanned && !listActive) ALERTS.push(`Estado de sprint no reconocido en ${esc(P.name)} · ${esc(l.n)}: <b>${esc(l.st)}</b> (se usaron las fechas)`);
      const dueMs = l.dd ? +l.dd : (per.b ? Date.UTC(per.b.y, per.b.m, per.b.d, 23, 59) : null);
      const startMs = l.sd ? +l.sd : (per.a ? Date.UTC(per.a.y, per.a.m, per.a.d) : null);
      if (sn > 0 && sd === sn) state = "done";
      else if (listClosed) state = "partial";
      else if (listActive) state = "active";
      else if (listPlanned) state = sn > 0 ? "active" : "planned";
      else if (dueMs && dueMs < nowMs) state = "partial";
      else if (startMs && startMs > nowMs && sn === 0) state = "planned";
      else state = "active";
      if (sn === 0 && state !== "planned") ALERTS.push(`${esc(P.name)} · SP-${l.num}: no tiene tareas con el campo <b>Proyectos HolaDOC</b> marcado`);
      const main = tasks.filter(t => t.l === l.id && !t.pa && !CFG.EXCLUDE_MAIN.some(x => low(t.n).startsWith(x)) && !CFG.CIERRE_IDS.includes(t.id) && +t.ct !== CFG.CIERRE_TYPE && t.src !== "B");
      return { id: l.id, code: "SP-" + l.num, per: per.txt, a: per.a, b: per.b, sd, sn, pc, state, main, ft };
    });
    const done = field.filter(t => isDone(t.s)).length;
    const as = sprints.filter(s => s.a), bs = sprints.filter(s => s.b);
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    let rango = "";
    if (as.length && bs.length) {
      const a = as.reduce((m, s) => (s.a.y * 12 + s.a.m < m.y * 12 + m.m ? s.a : m), as[0].a);
      const b = bs.reduce((m, s) => (s.b.y * 12 + s.b.m > m.y * 12 + m.m ? s.b : m), bs[0].b);
      rango = a.y === b.y ? `${cap(MES[a.m])} – ${cap(MES[b.m])} ${b.y}` : `${cap(MES[a.m])} ${a.y} – ${cap(MES[b.m])} ${b.y}`;
    }
    return { ...P, field, done, tot: field.length, pct: capped(done, field.length), sprints, rango };
  });

  // alertas: solo sobre las tareas que entran en el reporte (campo marcado en sprints, principales de sprint y backlogs)
  const bIds = CFG.BACKLOGS.map(B => B.id);
  const uni = [...new Set([...PROJ.flatMap(P => [...P.field, ...P.sprints.flatMap(s => s.main)]), ...tasks.filter(t => bIds.includes(t.l) && !t.pa)])];
  const unk = [...new Set(uni.map(t => t.s).filter(s => !CFG.ST[s]))];
  if (unk.length) ALERTS.push(`Estados de tarea nuevos sin mapear: <b>${unk.map(esc).join(", ")}</b>`);
  const newAs = [...new Set(uni.flatMap(t => (t.as || []).map(a => String(a))).filter(a => !CFG.KNOWN_ASSIGNEES.includes(low(a))))];
  if (newAs.length) ALERTS.push(`Asignados nuevos sin rol en el equipo: <b>${newAs.map(esc).join(", ")}</b>`);

  /* ---------- 00 Resumen ---------- */
  let RS_TOT = 0, RS_DONE = 0, RS_SP = 0, RS_CLOSED = 0, RS_PARTIAL = 0, RS_PLAN = 0; const PL = [], PLN = [];
  let rows = "", cards = "";
  const BADGE = { done: chip("ok", "✓ Completado"), partial: chip("warn", "✓ Cerrado con pendientes"), active: chip("run", "▶ En curso"), planned: chip("mut", "◷ Por iniciar") };
  PROJ.forEach(P => {
    RS_TOT += P.tot; RS_DONE += P.done;
    P.sprints.forEach(s => {
      RS_SP++;
      if (s.state === "planned") {
        RS_PLAN++; PLN.push(`${s.code} ${P.name}`);
        cards += `<div class="rscard"><div class="rsh"><b>${P.icon} ${P.name} · ${s.code}</b>${BADGE.planned}</div><div class="rsm">${s.per} · sin tareas aún</div></div>`;
        rows += `<tr><td>${P.icon} ${P.name}</td><td class="mono">${s.code}</td><td>${s.per}</td><td class="num">—</td><td class="num">—</td><td>—</td><td>${BADGE.planned}</td></tr>`;
        return;
      }
      if (s.state === "done") RS_CLOSED++;
      if (s.state === "partial") { RS_PARTIAL++; PL.push(`${s.code} ${P.name} (${s.pc}%)`); }
      cards += `<div class="rscard"><div class="rsh"><b>${P.icon} ${P.name} · ${s.code}</b>${BADGE[s.state]}</div><div class="rsm">${s.per} · ${s.sn} tareas + sub · ${s.main.length} principales</div><div class="rsb"><div class="bar thin"><i style="width:${s.pc}%"></i></div><span class="num">${s.pc}%</span></div></div>`;
      rows += `<tr><td>${P.icon} ${P.name}</td><td class="mono">${s.code}</td><td>${s.per}</td><td class="num">${s.sn}</td><td class="num">${s.main.length}</td><td><div class="mini"><i style="width:${s.pc}%"></i></div><span class="num">${s.pc}%</span></td><td>${BADGE[s.state]}</td></tr>`;
    });
  });
  const RS_PCT = capped(RS_DONE, RS_TOT), RS_RUN = RS_SP - RS_CLOSED - RS_PARTIAL - RS_PLAN;
  const allSp = PROJ.flatMap(P => P.sprints).filter(s => s.a && s.b);
  const fmtMY = d => `${MES[d.m]} ${d.y}`;
  const spanTxt = allSp.length ? `${fmtMY(allSp.reduce((m, s) => (s.a.y * 12 + s.a.m < m.y * 12 + m.m ? s.a : m), allSp[0].a))} – ${fmtMY(allSp.reduce((m, s) => (s.b.y * 12 + s.b.m > m.y * 12 + m.m ? s.b : m), allSp[0].b))}` : "";
  const projNames = PROJ.map(P => `<b>${P.name}</b>`).join(" y ");
  const t0 = `<div class="card"><div class="hero"><div><div class="lbl">Avance global del proyecto</div><div class="big">${RS_PCT}%</div>
<small class="note">${RS_DONE}/${RS_TOT} tareas y subtareas · Corte ${CORTE}</small></div>
<div><p style="margin:0">El % de avance completado a la fecha es calculado en función del trabajo realizado por el equipo en los proyectos ${projNames}, sobre las tareas y subtareas con el campo <b>Proyectos HolaDOC</b> marcado.</p>
<p class="note">${spanTxt} · Células <b>HolaDOC</b> · Androvent</p></div></div>
<div class="kpis"><div class="kpi"><b>${RS_SP}</b><small>Sprints totales</small></div><div class="kpi"><b>${RS_CLOSED + RS_PARTIAL}</b><small>Sprints cerrados<br>${RS_CLOSED} al 100% · ${RS_PARTIAL} con pendientes</small></div><div class="kpi"><b>${RS_RUN}</b><small>Sprints en curso</small></div><div class="kpi"><b>${RS_PLAN}</b><small>Sprints por iniciar</small></div><div class="kpi"><b>${CFG.TEAM.length}</b><small>Integrantes del equipo</small></div></div></div>
<div class="card"><div class="head"><h2>Estado de Sprints</h2><span class="lbl">Corte ${CORTE}</span></div>
<table class="tbl rstbl"><thead><tr><th>Proyecto</th><th>Sprint</th><th>Período</th><th class="num">Tareas + sub</th><th class="num">Principales</th><th>Avance</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table><div class="rscards">${cards}</div>
<p class="note">La célula HolaDOC acumula <b>${RS_CLOSED + RS_PARTIAL} sprints cerrados (${RS_CLOSED} al 100% · ${RS_PARTIAL} con pendientes) · ${RS_RUN} en ejecución · ${RS_PLAN} por iniciar · ${RS_SP} sprints en total</b>, con ${RS_DONE} tareas y subtareas completadas.${PL.length ? " Cerrados con pendientes: " + PL.join(" y ") + "." : ""}${PLN.length ? " Por iniciar: " + PLN.join(" y ") + "." : ""} ${CFG.NOTA_RESUMEN}</p></div>`;

  /* ---------- 01 Iniciativas ---------- */
  const t2cards = PROJ.map(P => {
    const ts = P.field, tot = ts.length;
    if (!tot) return `<div class="card init"><div class="row"><div><h3>${P.icon} ${P.ini}</h3><small>${P.startNote}</small></div><span class="pctpill">0%</span></div><div class="bar ${P.bar}"><i style="width:0%"></i></div>${chip("run", "▶ " + P.startNote)}</div>`;
    const code = id => (P.sprints.find(s => s.id === id) || {}).code || "?";
    const done = ts.filter(t => isDone(t.s)), doing = ts.filter(t => isDoing(t.s)), blk = ts.filter(t => isBlk(t.s));
    const pend = ts.filter(t => !isDone(t.s) && !isDoing(t.s) && !isBlk(t.s));
    const pct = capped(done.length, tot);
    const sps = P.sprints.filter(s => s.sn > 0);
    const closed = sps.filter(s => s.state === "done" || s.state === "partial").map(s => s.code);
    const active = sps.filter(s => s.state === "active").map(s => s.code);
    const parts = [`${tot} tareas`, `${done.length} completadas`];
    if (closed.length) parts.push(closed.length > 1 ? `${closed[0]} al ${closed[closed.length - 1]} cerrados` : `${closed[0]} cerrado`);
    if (active.length) parts.push(active.map(a => a + " activo").join(" · "));
    const grp = (lst, one, many) => {
      const m = {}; lst.forEach(t => { const k = code(t.l); m[k] = (m[k] || 0) + 1; });
      return Object.keys(m).sort().map(k => `${m[k]} ${lst.length > 1 ? many : one} – ${k}`).join(" · ");
    };
    let pills = chip("ok", `✓ ${done.length} completadas`);
    if (doing.length) pills += chip("run", "▶ " + grp(doing, "en curso", "en curso"));
    if (pend.length) pills += chip("pend", "◷ " + grp(pend, "pendiente", "pendientes"));
    if (blk.length) pills += chip("blk", "⊘ " + grp(blk, "bloqueada", "bloqueadas"));
    return `<div class="card init"><div class="row"><div><h3>${P.icon} ${P.ini}</h3><small>${parts.join(" · ")}</small></div><span class="pctpill">${pct}%</span></div><div class="bar ${P.bar}"><i style="width:${pct}%"></i></div>${pills}${CFG.MILESTONES[P.ini] ? `<div class="milestone">${CFG.MILESTONES[P.ini]}</div>` : ""}</div>`;
  }).join("");
  const t2 = `<div class="card"><div class="head"><h2>Estado actual de las iniciativas</h2><span class="lbl">Campo "Proyectos HolaDOC" · Sprints ClickUp · ${CORTE}</span></div>
<p class="note">% calculado sobre tareas y subtareas en <b>carpetas de sprints</b> con el campo <b>Proyectos HolaDOC</b> marcado por cada opción. Se cuenta el total real de tareas y subtareas con el campo marcado, sin exclusiones.</p>
${chip("ok", "✓ Completadas")}${chip("run", "▶ En curso")}${chip("pend", "◷ Pendiente")}${chip("blk", "⊘ Bloqueada")}</div>
${t2cards}
<div class="method"><b>Metodología:</b> % = tareas completadas / total de tareas y subtareas con campo <b>Proyectos HolaDOC</b> marcado (filtrado por opción) en carpetas de sprint, sin exclusiones. Si queda al menos una tarea abierta, el avance se muestra como máximo en 99%. Fuente: ClickUp API · Corte ${CORTE}.</div>`;

  /* ---------- 02 Sprints ---------- */
  const SBADGE = s => s.state === "done" ? chip("ok", "✓ Completado · 100%") : s.state === "partial" ? chip("warn", `✓ Cerrado con pendientes · ${s.pc}%`) : s.state === "planned" ? chip("mut", "◷ Por iniciar") : chip("run", `▶ En curso · ${s.pc}%`);
  const t3cards = PROJ.map(P => {
    const rws = P.sprints.map(s => {
      if (s.state === "planned" && !s.main.length) return `<details class="sprow"><summary><span class="spcode">${s.code}</span><span class="sptitle"><span class="dup">${s.code} · </span>${P.name} (${s.per})<small><em>Sprint por iniciar.</em></small></span>${SBADGE(s)}<span class="caret">▾</span></summary></details>`;
      const trs = s.main.map(t => { const x = st(t.s); return `<tr><td><span class="ic ${x[0]}">${x[1]}</span>${esc(String(t.n).trim())}</td><td>${chip(x[0], x[2])}</td></tr>`; }).join("");
      return `<details class="sprow"><summary><span class="spcode">${s.code}</span><span class="sptitle"><span class="dup">${s.code} · </span>${P.name} (${s.per})<small><em>Se muestran solo las tareas principales. Este sprint tiene muchas subtareas.</em></small></span>${SBADGE(s)}<span class="caret">▾</span></summary>
<table class="tbl tasks"><thead><tr><th>Historia / Tarea</th><th>Estado</th></tr></thead><tbody>${trs}</tbody></table></details>`;
    }).join("");
    const n = P.sprints.length;
    return `<div class="card init"><div class="row"><div><h3>${P.icon} ${P.name}</h3><small>${n} sprint${n > 1 ? "s" : ""} · ${P.rango}</small></div><span class="pctpill">${P.pct}%</span></div>
<div class="bar ${P.bar}"><i style="width:${P.pct}%"></i></div><small class="note">${P.done}/${P.tot} tareas completadas</small>${rws}</div>`;
  }).join("");
  const t3 = `<div class="card"><div class="head"><h2>Resultados de Sprints Ejecutados</h2><span class="lbl">${PROJ.length} proyectos · ClickUp · ${CORTE}</span></div>
<p class="note">Detalle de tareas principales por sprint, agrupadas por proyecto. % de cada proyecto calculado sobre tareas y subtareas con el campo <b>Proyectos HolaDOC</b> marcado. Las filas excluyen Reuniones y Ceremonias y las tareas de cierre de sprint.</p></div>${t3cards}`;

  /* ---------- 03 Backlog ---------- */
  const blocks = CFG.BACKLOGS.map(B => {
    const b = tasks.filter(t => t.l === B.id && !t.pa);
    const d = b.filter(t => isDone(t.s)).length, n = b.length, p = n ? Math.round(d * 100 / n) : 0;
    const cnt = {}; b.forEach(t => cnt[t.s] = (cnt[t.s] || 0) + 1);
    const sm = Object.entries(cnt).sort((x, y) => y[1] - x[1]).map(([k, v]) => chip(st(k)[0], `${v} ${st(k)[2].toLowerCase()}`)).join(" ");
    const trs = b.map(t => `<tr><td>${esc(String(t.n).trim())}</td><td class="mono">${tipo(t.n)}</td><td>${chip(st(t.s)[0], st(t.s)[2])}</td></tr>`).join("");
    return `<details class="sprint"><summary><span class="spcode">${B.icon}</span><span class="sptitle">${B.title} <a href="${B.link}" target="_blank" rel="noopener">↗ ClickUp</a><small>Product Backlog · ${n} historias/tareas · Espacio: Gestión de Células HolaDOC</small></span><span class="caret">▾</span></summary>
<div class="chips">${sm}</div><div class="bar"><i style="width:${p}%"></i></div>
<table class="tbl tasks bl"><thead><tr><th>Historia / Tarea</th><th>Tipo</th><th>Estado</th></tr></thead><tbody>${trs}</tbody></table></details>`;
  }).join("");
  const t4 = `<div class="card"><div class="head"><h2>Backlog por Iniciativa</h2><span class="lbl">Espacio: Gestión de Células HolaDOC · ${CORTE}</span></div>
<p class="note">Historias de usuario, épicas y tareas de los ${CFG.BACKLOGS.length} backlogs oficiales de la célula: Receta Electrónica V1 y VitalHub 2.0. El estado Sprint Backlog indica que la historia se ejecuta en el sprint activo.</p>
${chip("ok", "✓ Completada")}${chip("run", "▶ Sprint Backlog / En desarrollo")}${chip("pend", "◷ Product Backlog")}${chip("pend", "⏳ Pend. Producción")}${chip("blk", "⏸ Pausa / Bloqueo")}</div>${blocks}`;

  /* ---------- 04 Equipo ---------- */
  const ROLE = Object.fromEntries(CFG.TEAM);
  const team = CFG.TEAM_GROUPS.map(([g, ms]) => `<p class="note grp">${g}</p><div class="grid3">` + ms.map(n => `<div class="mcard"><div class="av">${ini(n)}</div><div><b>${n}</b><small>${ROLE[n]}</small></div></div>`).join("") + "</div>").join("");
  const t6 = `<div class="card"><div class="head"><h2>Equipo</h2><span class="lbl">Corte ${CORTE} · ${CFG.TEAM.length} integrantes</span></div>${team}</div>`;

  /* ---------- montaje ---------- */
  document.getElementById("corte").textContent = CORTE;
  document.getElementById("ver").textContent = `Versión ${VERSION} · ${CORTE_NUM}`;
  document.getElementById("foot").innerHTML = `Generado ${CORTE_NUM.replace(/\//g, "-")} · ClickUp Workspace · Gestión de Células HolaDOC · Receta Electrónica<br>Reporte generado por el equipo de la Gerencia de Proyectos · Confidencial · Uso Interno · v${esc(VERSION)}`;
  const banner = PREVIEW ? `<div class="card preview"><b>👁 Vista previa · borrador sin publicar</b> (versión ${esc(VERSION)} · corte ${CORTE_NUM})${ALERTS.length ? `<ul>${ALERTS.map(a => `<li>${a}</li>`).join("")}</ul>` : `<p class="note">Sin alertas: no hay sprints nuevos sin tareas, estados nuevos ni asignados nuevos.</p>`}</div>` : "";
  document.getElementById("app").innerHTML = banner +
    `<section class="tab on" id="t0">${t0}</section><section class="tab" id="t2">${t2}</section><section class="tab" id="t3">${t3}</section><section class="tab" id="t4">${t4}</section><section class="tab" id="t6">${t6}</section>`;
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { document.querySelectorAll("#tabs button,.tab").forEach(x => x.classList.remove("on")); b.classList.add("on"); document.getElementById(b.dataset.t).classList.add("on"); });
  if (PREVIEW) console.log("ALERTAS", ALERTS);
  window.__ALERTS = ALERTS;
}

</script></body></html>
